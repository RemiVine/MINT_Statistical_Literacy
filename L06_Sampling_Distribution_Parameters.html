<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecture 6 Quick Exercise: Sampling Distribution</title>
<style>
:root{--ink:#1f2937;--muted:#6b7280;--accent:#4f46e5;--accent2:#7c3aed;--ok:#15803d;--bad:#b91c1c;--paper:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:linear-gradient(135deg,#eef2ff,#faf5ff,#fff1f2);min-height:100vh}
main{max-width:900px;margin:0 auto;padding:28px 18px 48px}
header{text-align:center;margin-bottom:24px}
h1{margin:0 0 8px;font-size:clamp(28px,4vw,42px)}
.subtitle{color:var(--muted);font-size:18px;line-height:1.45}
.card{background:var(--paper);border:1px solid #e5e7eb;border-radius:18px;box-shadow:0 12px 30px rgba(31,41,55,.08);padding:24px;margin:18px 0}
.progress-row{display:flex;justify-content:space-between;gap:20px;align-items:end}
.kicker{text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--muted);font-weight:700}
.big{font-size:25px;font-weight:800;margin-top:2px}
.bar{height:13px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:14px}
.bar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .35s ease}
.badge{display:inline-block;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#fef3c7;color:#92400e;border:1px solid #fde68a}
.question-title{font-size:25px;margin:10px 0 18px}
.task{border-left:4px solid #f59e0b;background:#fffbeb;padding:15px 16px;border-radius:0 12px 12px 0;margin:14px 0;line-height:1.55}
.task strong{display:block;margin-bottom:4px}
.options{display:grid;gap:11px;margin-top:18px}
.option{width:100%;text-align:left;border:2px solid #d1d5db;background:#fff;border-radius:12px;padding:15px 16px;cursor:pointer;transition:.15s;font-size:16px;line-height:1.35}
.option:hover{border-color:#6366f1;background:#eef2ff}.option[disabled]{cursor:default}
.option.correct{border-color:#22c55e;background:#f0fdf4}.option.wrong{border-color:#ef4444;background:#fef2f2}.option.dim{opacity:.55;background:#f9fafb}
.feedback{border:2px solid;border-radius:12px;padding:16px;margin-top:16px;line-height:1.55}
.feedback.ok{border-color:#4ade80;background:#f0fdf4;color:#14532d}.feedback.bad{border-color:#f87171;background:#fef2f2;color:#7f1d1d}
.hint{background:#f5f3ff;border:1px solid #c4b5fd;color:#4c1d95;border-radius:10px;padding:13px 14px;margin-top:12px;line-height:1.5}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid #e5e7eb;flex-wrap:wrap}
button.secondary,button.primary,button.hintbtn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}
button.secondary{background:#f3f4f6;color:#374151}.hintbtn{background:transparent;color:#4f46e5;padding-left:0}
button.primary{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff}.primary:disabled{background:#d1d5db;color:#6b7280;cursor:default}
.guide h2{margin-top:0}.guide-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.guide-item{border:1px solid #e5e7eb;border-radius:12px;padding:14px;background:#fafafa;line-height:1.45}
.final{text-align:center}.final .score{font-size:54px;font-weight:900;color:#4f46e5}
.source{font-size:12px;color:#6b7280;text-align:center;margin-top:22px}
@media(max-width:600px){.card{padding:18px}.progress-row{align-items:flex-start}.big{font-size:21px}}
</style>
</head>
<body>
<main>
<header>
<h1>Lecture 6 Challenge: Sampling Distribution — Quick Exercise</h1>
<div class="subtitle">Practice reading the sampling distribution of sample averages and computing the Standard Error.</div>
</header>
<div id="app"></div>
<div class="card guide"><h2>Decision / revision guide</h2><div class="guide-grid" id="guide"></div></div>
<div class="source">Based on Statistical Literacy — MINT, Lecture 6: The sampling distribution.</div>
</main>
<script>
const quiz = {"questions":[{"title":"Student height: center of the sampling distribution","question":"The population average height of students is μ = 170 cm. Random samples of 25 students are taken. What is μₓ̄?","options":["160 cm","165 cm","170 cm","175 cm"],"correct":2,"explanation":"For sample averages, μₓ̄ = μ. Therefore μₓ̄ = 170 cm.","hint":"The sampling distribution of sample averages is centered on the population average.","difficulty":"easy"},{"title":"Student height: Standard Error","question":"The population standard deviation of student height is σ = 10 cm and samples contain n = 25 students. What is the Standard Error σₓ̄?","options":["0.4 cm","2 cm","10 cm","50 cm"],"correct":1,"explanation":"σₓ̄ = σ / √n = 10 / √25 = 10 / 5 = 2 cm.","hint":"Divide the population standard deviation by the square root of the sample size.","difficulty":"medium"},{"title":"Infant mortality: center","question":"A sample of 36 rural clinics has an average infant mortality rate of 38 deaths per 1,000 births. For the sampling distribution exercise, what value is used for μₓ̄?","options":["6 deaths per 1,000 births","36 deaths per 1,000 births","38 deaths per 1,000 births","44 deaths per 1,000 births"],"correct":2,"explanation":"The exercise uses 38 deaths per 1,000 births as the average associated with the sample-average distribution: μₓ̄ = 38.","hint":"Look at the value of the average given for the sample in the exercise.","difficulty":"easy"},{"title":"Infant mortality: Standard Error","question":"The known population standard deviation of infant mortality is σ = 6 deaths per 1,000 births and the sample size is n = 36. What is the Standard Error σₓ̄?","options":["0.5 deaths per 1,000 births","1 death per 1,000 births","6 deaths per 1,000 births","36 deaths per 1,000 births"],"correct":1,"explanation":"σₓ̄ = σ / √n = 6 / √36 = 6 / 6 = 1 death per 1,000 births.","hint":"The square root of 36 is 6.","difficulty":"medium"},{"title":"Clean water access: center","question":"A development project samples 100 villages and finds an average clean-water access rate of 72%. What value is used for μₓ̄ in the sampling-distribution exercise?","options":["64%","72%","80%","100%"],"correct":1,"explanation":"The exercise uses the observed average of 72% as μₓ̄ for this example.","hint":"Identify the average reported for the sampled villages.","difficulty":"easy"},{"title":"Clean water access: Standard Error","question":"Previous large-scale data suggest a population standard deviation of 8 percentage points for clean-water access. The project samples n = 100 villages. What is the Standard Error σₓ̄?","options":["0.08 percentage points","0.8 percentage points","8 percentage points","80 percentage points"],"correct":1,"explanation":"σₓ̄ = σ / √n = 8 / √100 = 8 / 10 = 0.8 percentage points.","hint":"The square root of 100 is 10.","difficulty":"medium"}],"guide":["<strong>Center:</strong> for sample averages, μₓ̄ = μ.","<strong>Standard Error:</strong> σₓ̄ = σ / √n.","<strong>Sample size:</strong> increasing n makes the sampling distribution more compact because the Standard Error decreases.","<strong>Units:</strong> the Standard Error has the same units as the variable being averaged."]};
let state={i:0,selected:null,answered:false,showHint:false,score:0};
const app=document.getElementById('app'),guide=document.getElementById('guide');
guide.innerHTML=quiz.guide.map(x=>`<div class="guide-item">${x}</div>`).join('');
function render(){
 const q=quiz.questions[state.i],progress=((state.i+1)/quiz.questions.length)*100,complete=state.i===quiz.questions.length-1&&state.answered;
 const options=q.options.map((o,idx)=>{let cls='option';if(state.answered){if(idx===q.correct)cls+=' correct';else if(idx===state.selected)cls+=' wrong';else cls+=' dim';}return `<button class="${cls}" onclick="answer(${idx})" ${state.answered?'disabled':''}><strong>${String.fromCharCode(65+idx)}.</strong> ${o}</button>`}).join('');
 let feedback='';if(state.answered){const ok=state.selected===q.correct;feedback=`<div class="feedback ${ok?'ok':'bad'}"><strong>${ok?'Excellent.':'Not quite.'}</strong><div style="margin-top:6px">${q.explanation}</div></div>`}
 const hint=state.showHint&&!state.answered?`<div class="hint"><strong>Hint:</strong> ${q.hint}</div>`:'';
 const next=state.answered?`<button class="primary" onclick="nextQuestion()" ${state.i===quiz.questions.length-1?'disabled':''}>Next question</button>`:'';
 app.innerHTML=`<div class="card"><div class="progress-row"><div><div class="kicker">Progress</div><div class="big">Question ${state.i+1} of ${quiz.questions.length}</div></div><div style="text-align:right"><div class="kicker">Score</div><div class="big" style="color:#4f46e5">${state.score}/${quiz.questions.length}</div></div></div><div class="bar"><div style="width:${progress}%"></div></div></div>
 <div class="card"><span class="badge">${q.difficulty}</span><h2 class="question-title">${q.title}</h2><div class="task"><strong>Your task</strong>${q.question}</div><div class="options">${options}</div>${!state.answered?`<button class="hintbtn" onclick="toggleHint()">${state.showHint?'Hide hint':'Need a hint?'}</button>`:''}${hint}${feedback}<div class="actions"><button class="secondary" onclick="restart()">Restart quiz</button>${next}</div></div>${complete?finalCard():''}`;
}
function answer(idx){if(state.answered)return;state.selected=idx;state.answered=true;if(idx===quiz.questions[state.i].correct)state.score++;render();}
function nextQuestion(){if(state.i<quiz.questions.length-1){state.i++;state.selected=null;state.answered=false;state.showHint=false;render();}}
function toggleHint(){state.showHint=!state.showHint;render();}
function restart(){state={i:0,selected:null,answered:false,showHint:false,score:0};render();}
function finalCard(){const pct=Math.round(state.score/quiz.questions.length*100);const msg=pct===100?'Perfect score.':pct>=75?'Strong understanding of the sampling distribution.':pct>=50?'Good work — review the Standard Error formula.':'Review the revision guide and try again.';return `<div class="card final"><div class="kicker">Challenge complete</div><div class="score">${state.score}/${quiz.questions.length}</div><div style="font-size:20px;margin-bottom:8px">${pct}% correct</div><p>${msg}</p><button class="primary" onclick="restart()">Retry challenge</button></div>`}
render();
</script>
</body>
</html>
