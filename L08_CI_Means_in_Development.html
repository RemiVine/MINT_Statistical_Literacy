<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecture 8 Challenge: Mean Confidence Intervals in Humanitarian and Development Settings</title>
<style>
:root { --ink:#1f2937; --muted:#6b7280; --accent:#4f46e5; --accent2:#7c3aed; --ok:#15803d; --bad:#b91c1c; --paper:#ffffff; }
* { box-sizing:border-box; }
body { margin:0; font-family:Arial,Helvetica,sans-serif; color:var(--ink); background:linear-gradient(135deg,#eef2ff,#faf5ff,#fff1f2); min-height:100vh; }
main { max-width:900px; margin:0 auto; padding:28px 18px 48px; }
header { text-align:center; margin-bottom:24px; }
h1 { margin:0 0 8px; font-size:clamp(28px,4vw,42px); }
.subtitle { color:var(--muted); font-size:18px; line-height:1.45; }
.card { background:var(--paper); border:1px solid #e5e7eb; border-radius:18px; box-shadow:0 12px 30px rgba(31,41,55,.08); padding:24px; margin:18px 0; }
.progress-row { display:flex; justify-content:space-between; gap:20px; align-items:end; }
.kicker { text-transform:uppercase; letter-spacing:.08em; font-size:12px; color:var(--muted); font-weight:700; }
.big { font-size:25px; font-weight:800; margin-top:2px; }
.bar { height:13px; background:#e5e7eb; border-radius:999px; overflow:hidden; margin-top:14px; }
.bar > div { height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .35s ease; }
.badge { display:inline-block; padding:5px 10px; border-radius:999px; font-size:12px; font-weight:700; background:#fef3c7; color:#92400e; border:1px solid #fde68a; }
.scenario-title { font-size:25px; margin:10px 0 18px; }
.panel { border-left:4px solid #3b82f6; background:#eff6ff; padding:15px 16px; border-radius:0 12px 12px 0; margin:14px 0; line-height:1.55; }
.panel.task { border-left-color:#f59e0b; background:#fffbeb; }
.panel strong { display:block; margin-bottom:4px; }
.options { display:grid; gap:11px; margin-top:18px; }
.option { width:100%; text-align:left; border:2px solid #d1d5db; background:#fff; border-radius:12px; padding:15px 16px; cursor:pointer; transition:.15s; font-size:16px; }
.option:hover { border-color:#6366f1; background:#eef2ff; }
.option[disabled] { cursor:default; }
.option.correct { border-color:#22c55e; background:#f0fdf4; }
.option.wrong { border-color:#ef4444; background:#fef2f2; }
.option.dim { opacity:.55; background:#f9fafb; }
.feedback { border:2px solid; border-radius:12px; padding:16px; margin-top:16px; line-height:1.55; }
.feedback.ok { border-color:#4ade80; background:#f0fdf4; color:#14532d; }
.feedback.bad { border-color:#f87171; background:#fef2f2; color:#7f1d1d; }
.hint { background:#f5f3ff; border:1px solid #c4b5fd; color:#4c1d95; border-radius:10px; padding:13px 14px; margin-top:12px; line-height:1.5; }
.actions { display:flex; justify-content:space-between; gap:12px; margin-top:18px; padding-top:16px; border-top:1px solid #e5e7eb; flex-wrap:wrap; }
button.secondary, button.primary, button.hintbtn { border:0; border-radius:10px; padding:11px 15px; font-weight:700; cursor:pointer; }
button.secondary { background:#f3f4f6; color:#374151; }
button.hintbtn { background:transparent; color:#4f46e5; padding-left:0; }
button.primary { background:linear-gradient(90deg,var(--accent),var(--accent2)); color:#fff; }
button.primary:disabled { background:#d1d5db; color:#6b7280; cursor:default; }
.guide h2 { margin-top:0; }
.guide-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
.guide-item { border:1px solid #e5e7eb; border-radius:12px; padding:14px; background:#fafafa; line-height:1.45; }
.final { text-align:center; }
.final .score { font-size:54px; font-weight:900; color:#4f46e5; }
.source { font-size:12px; color:#6b7280; text-align:center; margin-top:22px; }
@media (max-width:600px){ .card{padding:18px}.progress-row{align-items:flex-start}.big{font-size:21px} }
</style>
</head>
<body>
<main>
<header>
  <h1>Lecture 8 Challenge: Mean Confidence Intervals in Humanitarian and Development Settings</h1>
  <div class="subtitle"> </div>
</header>
<div id="app"></div>
<div class="card guide">
  <h2>Decision / revision guide</h2>
  <div class="guide-grid" id="guide"></div>
</div>
<div class="source">Based on Statistical Literacy - MINT, Lecture 8. </div>
</main>
<script>
const quiz = {"questions": [{"title": "UNHCR camp-size example: Standard Error", "context": "A random sample of 51 refugee camps has average population 250 people and sample standard deviation s = 15 people. Population variance is not known.", "question": "What is the Standard Error, approximately?", "options": ["0.29 people", "2.10 people", "15 people", "107.1 people"], "correct": 1, "explanation": "s_x-bar = 15 / sqrt(51) = approximately 2.10 people.", "hint": "Use the sample standard deviation because the population variance is not available.", "difficulty": "medium"}, {"title": "UNHCR camp-size example: critical value", "context": "For the same sample, a 99% confidence interval is required. Population variance is not known, so the Student distribution is used with d.o.f. = 50.", "question": "Which critical value is used in the slides?", "options": ["1.645", "1.960", "2.326", "2.678"], "correct": 3, "explanation": "The lecture uses t with 50 degrees of freedom and alpha/2 = 0.005, giving a critical value of 2.678.", "hint": "Match the confidence level, degrees of freedom, and two-sided tail probability.", "difficulty": "hard"}, {"title": "UNHCR camp-size example: interval", "context": "For the refugee-camp example, the slides obtain Standard Error about 2.10 and Student critical value 2.678.", "question": "Which 99% confidence interval is reported?", "options": ["(244.375, 255.625)", "(245.800, 254.200)", "(248.040, 251.960)", "(235.000, 265.000)"], "correct": 0, "explanation": "The Margin of Error is approximately 2.10 x 2.678 = 5.625, so 250 +/- 5.625 gives (244.375, 255.625).", "hint": "Compute the Margin of Error, then move the same amount below and above 250.", "difficulty": "hard"}, {"title": "Known population standard deviation", "context": "Now assume the 15-person standard deviation is the population standard deviation. For the same 99% confidence level, the slides switch to z approximately 2.58.", "question": "What happens to the confidence interval?", "options": ["It becomes slightly narrower", "It becomes much wider", "Its center moves away from 250", "It becomes one-sided"], "correct": 0, "explanation": "With the Normal critical value z approximately 2.58 instead of Student t = 2.678, the Margin of Error is smaller, so the interval is slightly narrower.", "hint": "Compare the two critical values while keeping the point estimate and Standard Error otherwise aligned.", "difficulty": "medium"}, {"title": "Made-up food-distribution example", "context": "A programme samples n = 64 distribution sites. The average waiting time is 72 minutes, the population variance is unknown, and the sample standard deviation is s = 16 minutes. For a 95% interval, suppose the Student critical value is 2.000.", "question": "What is the Margin of Error?", "options": ["0.25 minutes", "2 minutes", "4 minutes", "32 minutes"], "correct": 2, "explanation": "Standard Error = 16 / sqrt(64) = 2 minutes. MoE = 2.000 x 2 = 4 minutes.", "hint": "Compute the Standard Error before multiplying by the stated critical value.", "difficulty": "medium"}, {"title": "Made-up household-expenditure example", "context": "A study has x-bar = CHF 120, known population standard deviation sigma = CHF 30, n = 100, and a 95% Normal critical value z = 1.96.", "question": "Which confidence interval is correct?", "options": ["[90.00, 150.00]", "[114.12, 125.88]", "[117.00, 123.00]", "[118.04, 121.96]"], "correct": 1, "explanation": "Standard Error = 30 / sqrt(100) = 3. MoE = 1.96 x 3 = 5.88. Therefore the interval is 120 +/- 5.88 = [114.12, 125.88].", "hint": "Use the known population standard deviation, then apply the Normal critical value.", "difficulty": "hard"}], "guide": ["<strong>Step 1:</strong> verify validity; in this class n &gt; 30 is the rule of thumb unless the population variable is Normal.", "<strong>Unknown population variance:</strong> Standard Error = s / sqrt(n), use Student t with d.o.f. = n - 1.", "<strong>Known population variance:</strong> Standard Error = sigma / sqrt(n), use Normal z critical value.", "<strong>Interval:</strong> x-bar +/- MoE, then interpret at the selected confidence level."]};
let state = { i:0, selected:null, answered:false, showHint:false, score:0 };
const app = document.getElementById('app');
const guide = document.getElementById('guide');

guide.innerHTML = quiz.guide.map(x => `<div class="guide-item">${x}</div>`).join('');

function render(){
  const q = quiz.questions[state.i];
  const progress = ((state.i+1)/quiz.questions.length)*100;
  const complete = state.i === quiz.questions.length-1 && state.answered;
  let options = q.options.map((o,idx)=>{
    let cls='option';
    if(state.answered){
      if(idx===q.correct) cls += ' correct';
      else if(idx===state.selected) cls += ' wrong';
      else cls += ' dim';
    }
    return `<button class="${cls}" onclick="answer(${idx})" ${state.answered?'disabled':''}><strong>${String.fromCharCode(65+idx)}.</strong> ${o}</button>`;
  }).join('');
  let feedback='';
  if(state.answered){
    const ok=state.selected===q.correct;
    feedback = `<div class="feedback ${ok?'ok':'bad'}"><strong>${ok?'Excellent.':'Not quite.'}</strong><div style="margin-top:6px">${q.explanation}</div></div>`;
  }
  let hint = state.showHint && !state.answered ? `<div class="hint"><strong>Hint:</strong> ${q.hint}</div>` : '';
  let nextButton = state.answered ? `<button class="primary" onclick="next()" ${state.i===quiz.questions.length-1?'disabled':''}>Next scenario</button>` : '';
  app.innerHTML = `
    <div class="card">
      <div class="progress-row">
        <div><div class="kicker">Progress</div><div class="big">Scenario ${state.i+1} of ${quiz.questions.length}</div></div>
        <div style="text-align:right"><div class="kicker">Score</div><div class="big" style="color:#4f46e5">${state.score}/${quiz.questions.length}</div></div>
      </div>
      <div class="bar"><div style="width:${progress}%"></div></div>
    </div>
    <div class="card">
      <span class="badge">${q.difficulty}</span>
      <h2 class="scenario-title">${q.title}</h2>
      <div class="panel"><strong>Context</strong>${q.context}</div>
      <div class="panel task"><strong>Your task</strong>${q.question}</div>
      <div class="options">${options}</div>
      ${!state.answered?`<button class="hintbtn" onclick="toggleHint()">${state.showHint?'Hide hint':'Need a hint?'}</button>`:''}
      ${hint}
      ${feedback}
      <div class="actions">
        <button class="secondary" onclick="restart()">Restart quiz</button>
        ${nextButton}
      </div>
    </div>
    ${complete?finalCard():''}`;
}
function answer(idx){
  if(state.answered) return;
  state.selected=idx; state.answered=true;
  if(idx===quiz.questions[state.i].correct) state.score++;
  render();
}
function next(){
  if(state.i < quiz.questions.length-1){ state.i++; state.selected=null; state.answered=false; state.showHint=false; render(); }
}
function toggleHint(){ state.showHint=!state.showHint; render(); }
function restart(){ state={i:0,selected:null,answered:false,showHint:false,score:0}; render(); }
function finalCard(){
  const pct=Math.round(state.score/quiz.questions.length*100);
  let msg = pct===100 ? 'Perfect score.' : pct>=80 ? 'Strong performance.' : pct>=60 ? 'Good foundation - review the explanations.' : 'Keep practicing with the revision guide.';
  return `<div class="card final"><div class="kicker">Challenge complete</div><div class="score">${state.score}/${quiz.questions.length}</div><div style="font-size:20px;margin-bottom:8px">${pct}% correct</div><p>${msg}</p><button class="primary" onclick="restart()">Retry challenge</button></div>`;
}
render();
</script>
</body>
</html>
